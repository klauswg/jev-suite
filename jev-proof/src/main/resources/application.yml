server:
  port: 8081
  address: 127.0.0.1   # demo-only

spring:
  application:
    name: jev-proof

jev:
  typesafe:
    base-url: https://api.typesafe.ai/v1/systemone
    api-key: ${TYPESAFE_API_KEY:}
    model: ${JEV_MODEL:jev-latest}
    timeout-ms: 8000
  ytdlp:
    path: ${YTDLP_PATH:yt-dlp}

logging:
  level:
    com.jevsuite: INFO
