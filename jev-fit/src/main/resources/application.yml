server:
  port: 8082
  address: 127.0.0.1   # demo-only；简历数据敏感，生产部署需前置鉴权

spring:
  application:
    name: jev-fit

jev:
  typesafe:
    base-url: https://api.typesafe.ai/v1/systemone
    api-key: ${TYPESAFE_API_KEY:}
    model: ${JEV_MODEL:jev-latest}
    timeout-ms: 8000

logging:
  level:
    com.jevsuite: INFO
